name: tests

# Headless CI in a reproducible devcontainer. The devcontainer carries an
# EigenScript source tree pinned by .devcontainer/Dockerfile's EIGS_REF (with
# EIGS_DIR/PATH baked in) and builds the gfx variant, so the SAME image a
# Codespace opens — where `make run`/`make shot` render the game — is what CI
# runs acceptance in. The display-dependent oracle has its own job so the
# portable headless suite remains display/toolchain independent.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: suite (in devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build devcontainer and run headless suite
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -e
            make lint
            make test

  gfx-oracle:
    name: gfx oracle (in devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run real-surface acceptance oracle
        uses: devcontainers/ci@v0.3
        with:
          runCmd: make gfx-oracle

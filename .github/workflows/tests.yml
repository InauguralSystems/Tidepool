name: tests

# Headless CI in a reproducible devcontainer. The devcontainer carries an
# EigenScript source tree pinned by .devcontainer/Dockerfile's EIGS_REF (with
# EIGS_DIR/PATH baked in) and builds the gfx variant, so the SAME image a
# Codespace opens — where `make run`/`make shot` render the game — is what CI
# runs the headless suite in. The gfx entry points still aren't executed here;
# `make lint` parse-checks every source, `make test` runs the headless suite.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: suite (in devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build devcontainer and run headless suite
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -e
            make lint
            make test
